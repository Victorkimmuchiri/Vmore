<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/logo.jpg" type="image/jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vmore Gift Shop — Preserving Culture, Crafting Memories. Discover handcrafted heritage jewelry, textiles, and accessories inspired by African musical traditions." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <title>Vmore Gift Shop — Preserving Culture, Crafting Memories</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{background:#0d0b09}
      .no-scroll { overflow: hidden; }

      .splash{
        position:fixed;inset:0;z-index:9999;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:#0d0b09;
        transition:opacity .8s ease,visibility .8s ease;
      }
      .splash.hide{opacity:0;visibility:hidden;pointer-events:none}

      .splash-logo{
        width:120px;height:120px;border-radius:50%;
        object-fit:cover;
        animation:breathe 2.4s ease-in-out infinite;
        margin-bottom:1.5rem;
        box-shadow:0 0 40px rgba(180,144,60,.25);
      }
      .splash-name{
        font-family:'Cormorant Garamond',serif;
        font-size:2.2rem;font-weight:700;letter-spacing:6px;
        color:#c9a84c;
        animation:breathe 2.4s ease-in-out infinite;
      }
      .splash-sub{
        font-family:'Inter',sans-serif;
        font-size:.7rem;letter-spacing:5px;
        color:rgba(180,144,60,.6);margin-top:.5rem;
        animation:breathe 2.4s ease-in-out infinite;
        animation-delay:.3s;
      }

      @keyframes breathe{
        0%,100%{transform:scale(1);opacity:.75}
        50%{transform:scale(1.08);opacity:1}
      }
    </style>
  </head>
  <body class="no-scroll">
    <div id="splash" class="splash">
      <img src="/images/logo.jpg" alt="Vmore Logo" class="splash-logo" />
      <div class="splash-name">VMORE</div>
      <div class="splash-sub">GIFT SHOP</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
